<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Norman Borlaug Tribute</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="main">

    <h1 id="title">Dr. Norman Borlaug</h1>

    <figure id="img-div">
      <img
        id="image"
        src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute-page-main-image.jpg"
        alt="Dr. Norman Borlaug standing with other people"
      >

      <figcaption id="img-caption">
        Dr. Norman Borlaug with a group of farmers.
      </figcaption>
    </figure>

    <section id="tribute-info">
      <p>
        Dr. Norman Borlaug was an agricultural scientist whose work helped
        improve food production and fight hunger around the world.
      </p>
    </section>

    <a
      id="tribute-link"
      href="https://en.wikipedia.org/wiki/Norman_Borlaug"
      target="_blank"
    >
      Learn more about Dr. Norman Borlaug
    </a>

  </main>

</body>
</html>
